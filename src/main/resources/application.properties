# Configurações do banco de dados postgresql
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:petshop}
%prod.quarkus.datasource.password=${DB_PASS:petshop}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petshop_db}?currentSchema=${DB_SCHEMA:public}
quarkus.hibernate-orm.database.generation=update

# Jacoco Test Coverage Configuration
quarkus.jacoco.report=true
quarkus.jacoco.minimum-line-coverage=0.5

# Configurações iniciais do rabbitmq
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USER:guest}
%prod.rabbitmq-password=${RABBITMQ_PASS:guest}
%prod.rabbitmq-virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
%prod.rabbitmq-ssl=${RABBITMQ_SSL:false}

# Envio de agendamento do rabbitmq
mp.messaging.outgoing.appointment-scheduled.connector=smallrye-rabbitmq
mp.messaging.outgoing.appointment-scheduled.exchange.name=appointment-events

mp.messaging.outgoing.appointment-cancelled.connector=smallrye-rabbitmq
mp.messaging.outgoing.appointment-cancelled.exchange.name=appointment-cancelled-events

# Configurações exclusivas para o perfil de Testes
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.rabbitmq.devservices.enabled=false

# Inclui o Swagger UI no build final para que esteja disponível
quarkus.swagger-ui.always-include=true

# Desativar o Swagger no ambiente de homologação
%homol.quarkus.swagger-ui.enable=false